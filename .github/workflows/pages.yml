name: Publish Classic Pod

on:
  push:
    branches: [codex/site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: classic-pod-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare player assets
        run: |
          mkdir _site
          cp index.html app.js style.css fill-layout.css fill-layout.js sw.js manifest.webmanifest immersive.html immersive.css immersive.js immersive.webmanifest icon.png icon-512.png _site/
          cp -R vendor _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
